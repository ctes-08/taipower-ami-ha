name: Bug report
description: Report a reproducible problem using redacted information only.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Taipower AMI. This is an unofficial alpha integration.

        **Do not attach credentials, captured browser data, Home Assistant backups, private addresses, account identifiers, or unreviewed logs.** Use the repository Security policy for a vulnerability.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include a HAR, browser profile, cookies, `credentials.json`, a Home Assistant backup, `SESSION`, enkey, password, access token, account number, electric number, private address, or signing identity.
          required: true
        - label: I reviewed every screenshot, diagnostic export, and log excerpt for identifying or credential-bearing data.
          required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.x.y"
    validations:
      required: true

  - type: input
    id: integration-version
    attributes:
      label: Taipower AMI integration version
      placeholder: "0.1.0-alpha.1"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Local custom_components copy
        - HACS
        - Other
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the expected result and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction steps
      description: Provide only redacted steps. Do not include real URLs with query values or browser capture data.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: sanitized-summary
    attributes:
      label: Sanitized error summary
      description: Optional. Prefer the exception class and a short redacted message over raw logs.
    validations:
      required: false
