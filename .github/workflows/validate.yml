name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Compile Python sources
        run: python -m compileall -q custom_components tests
      - name: Lint
        run: ruff check .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repository contract
        run: python tests/test_repository_contract.py -v
