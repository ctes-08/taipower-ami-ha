name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests and lint (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test tools
        run: python -m pip install ".[test]"
      - name: Compile Python sources
        run: python -m compileall -q custom_components tests
      - name: Lint
        run: ruff check .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  repository-contract:
    name: Public repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate repository contract
        run: python tests/test_repository_contract.py -v

  ha-lifecycle:
    name: Home Assistant lifecycle (${{ matrix.ha_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_version: "2025.12.0 minimum"
            python: "3.13"
            extra: ha-test-minimum
          - ha_version: "2026.8.3 stable"
            python: "3.14"
            extra: ha-test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned Home Assistant test runtime
        run: python -m pip install ".[${{ matrix.extra }}]"
      - name: Run isolated Home Assistant lifecycle tests
        run: python -m pytest tests/ha_lifecycle.py

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb
