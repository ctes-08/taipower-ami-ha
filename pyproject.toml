[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taipower-ami-ha"
version = "0.1.0a1"
description = "Alpha Home Assistant custom integration for read-only Taipower AMI data"
readme = "README.md"
requires-python = ">=3.13"

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "ruff>=0.9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
